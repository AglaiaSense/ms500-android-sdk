plugins {
    id 'com.android.library'
    id 'maven-publish'
}
import org.apache.tools.ant.taskdefs.condition.Os
apply from: rootProject.file('gradle/publish-android-library.gradle')
android {
    compileSdkVersion rootProject.ext.versionCompiler
    ndkVersion rootProject.ext.ndkVersion
    compileOptions {
        sourceCompatibility rootProject.ext.javaSourceCompatibility
        targetCompatibility rootProject.ext.javaTargetCompatibility
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.versionTarget
        versionName rootProject.ext.versionNameString
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
tasks.withType(JavaCompile) {
    compileTask -> compileTask.dependsOn ndkBuild
}
String getNdkBuildPath() {
    def ndkBuildingDir = System.getenv("ANDROID_NDK_HOME")
    if (ndkBuildingDir==null || ndkBuildingDir.isEmpty()) {
        ndkBuildingDir = System.getenv("NDK_HOME")
    }
    if (ndkBuildingDir==null || ndkBuildingDir.isEmpty()) {
        ndkBuildingDir = android.ndkDirectory?.absolutePath
    }
    if (ndkBuildingDir==null || ndkBuildingDir.isEmpty()) {
        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        ndkBuildingDir = properties.getProperty('ndk.dir')
    }
    if (ndkBuildingDir==null || ndkBuildingDir.isEmpty()) {
        throw new GradleException("NDK path not found. Please install NDK ${rootProject.ext.ndkVersion} or set ANDROID_NDK_HOME.")
    }
    def ndkBuildPath = ndkBuildingDir
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        ndkBuildPath = ndkBuildingDir + '/ndk-build.cmd'
    } else {
        ndkBuildPath = ndkBuildingDir + '/ndk-build'
    }
    return ndkBuildPath
}
task ndkBuild(type: Exec, description: 'Compile JNI source via NDK') {
    println('executing ndkBuild')
    def ndkBuildPath = getNdkBuildPath();
    commandLine ndkBuildPath, '-j8', '-C', file('src/main').absolutePath
}
task ndkClean(type: Exec, description: 'clean JNI libraries') {
    println('executing ndkBuild clean')
    def ndkBuildPath = getNdkBuildPath();
    commandLine ndkBuildPath, 'clean', '-C', file('src/main').absolutePath
}
clean.dependsOn 'ndkClean'
dependencies {
    implementation fileTree(dir: new File(buildDir, 'libs'), include: '*.jar')
    implementation "androidx.appcompat:appcompat:${androidXVersion}"
    implementation 'com.elvishew:xlog:1.11.0'
}